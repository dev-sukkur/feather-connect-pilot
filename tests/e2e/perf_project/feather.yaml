    connector: perf.source
    auth: {signature_secret: "${secret:env:HOOK_SECRET}"}
  perf_ticks: {connector: perf.clock_source}
  perf_cron: {connector: perf.clock_source}
  perf_sink: {connector: perf.sink}
  perf_cron_sink: {connector: perf.sink}
