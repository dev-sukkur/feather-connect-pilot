name: Release

# On a version tag, build the server and worker images for linux/amd64 and linux/arm64 (NFR-12) and push them to
# ghcr.io/<org>, where <org> is the repository variable FEATHER_IMAGE_ORG until discovery Q9 names it. Signing and
# the SBOM come with the release work in M3.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [server, worker]
    env:
      ORG: ${{ vars.FEATHER_IMAGE_ORG || 'feather-connect' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.ORG }}/feather-${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ env.ORG }}/feather-${{ matrix.image }}:latest
