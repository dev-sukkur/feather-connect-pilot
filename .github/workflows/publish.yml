name: Publish to PyPI

# Every package of the workspace, built at a release tag and published to PyPI by trusted publishing: PyPI trusts this
# workflow's OIDC identity, so no token is kept (M3 plan 1 L2). It publishes only when the repository variable
# FEATHER_PYPI is "true": the PyPI names wait for discovery Q9, and each name needs a trusted publisher set up for
# this repository, this workflow and the environment `pypi`, first.
on:
  workflow_call:
    inputs:
      tag: {type: string, required: true}
  workflow_dispatch:
    inputs:
      tag: {description: "The release tag, such as v1.0.0", type: string, required: true}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Wheels only: feather-cli's wheel holds the templates of ../../templates, which a wheel built from its sdist
      # can't reach.
      - name: Build every package
        run: uv build --all-packages --wheel --out-dir dist
      - name: Every package carries the tag's version
        run: |
          version="${{ inputs.tag }}"; version="${version#v}"
          ls dist
          test "$(ls dist/*.whl | grep -vc -- "-${version}-")" = 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  publish:
    needs: build
    if: vars.FEATHER_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
