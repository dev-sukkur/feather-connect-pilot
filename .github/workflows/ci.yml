name: CI

on:
  pull_request:
  schedule:
    - cron: "17 2 * * *" # the nightly run of the engine conformance suite and the chaos and performance checks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest packages/feather-connect/tests packages/connectors packages/templates tests/demo tests/templates -m "not postgres"

  # The tests marked `postgres` need a server, which only Linux runners can host. This job runs every test
  # and holds the coverage gate.
  postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: feather
          POSTGRES_PASSWORD: feather
          POSTGRES_DB: feather_test
        ports:
          - 25433:5432
        options: >-
          --health-cmd "pg_isready -U feather -d feather_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      FEATHER_TEST_DATABASE_URL: postgresql://feather:feather@127.0.0.1:25433/feather_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --all-extras
      - run: uv run pytest packages/feather-connect/tests packages/feather-engine-dbos/tests packages/feather-server/tests packages/feather-cli/tests packages/connectors packages/templates tests/templates tests/demo tests/e2e tests/dev --cov=feather_connect --cov=feather_engine_dbos --cov=feather_server --cov=feather_cli --cov-fail-under=85

  # The engine conformance suite starts real worker processes and takes minutes. It runs every night, and on a
  # pull request only when the change touches the engine.
  engine-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: feather
          POSTGRES_PASSWORD: feather
          POSTGRES_DB: feather_test
        ports:
          - 25433:5432
        options: >-
          --health-cmd "pg_isready -U feather -d feather_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      FEATHER_TEST_DATABASE_URL: postgresql://feather:feather@127.0.0.1:25433/feather_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the engine changed
        id: engine
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]             || ! git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- packages/feather-engine-dbos; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.engine.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: steps.engine.outputs.run == 'true'
        run: uv sync --all-extras
      - if: steps.engine.outputs.run == 'true'
        run: uv run pytest tests/engine_conformance

  # The chaos checks kill real workers and servers, restart a database (a container of their own, on 25434, with the
  # Docker the runner has) and slow the network to it, and take minutes. They run every night, and on a pull request
  # whenever the change touches a package or a test, since crash safety can break anywhere in the product's code.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: feather
          POSTGRES_PASSWORD: feather
          POSTGRES_DB: feather_test
        ports:
          - 25433:5432
        options: >-
          --health-cmd "pg_isready -U feather -d feather_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      FEATHER_TEST_DATABASE_URL: postgresql://feather:feather@127.0.0.1:25433/feather_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the product or the checks changed
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] \
            || ! git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- packages tests conftest.py pyproject.toml uv.lock .github/workflows/ci.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: steps.changes.outputs.run == 'true'
        run: uv sync --all-extras
      - if: steps.changes.outputs.run == 'true'
        run: uv run pytest tests/chaos tests/hard_cases -s

  # NFR-01 to NFR-03 on a runner of their own, with nothing else running (M3 plan 1 P1). Each test warms up first; the
  # tests run twice and each number keeps its better result, so one slow run on a shared runner doesn't fail the job,
  # while a regression of more than 20% against this runner's baseline (docs/06-release/perf-baseline.json) does.
  # NFR-03's sustained run of 5 million records takes some minutes and runs nightly only. The webhook latency and
  # burst checks are named by file: `tests/e2e` as a folder leaves them out.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: feather
          POSTGRES_PASSWORD: feather
          POSTGRES_DB: feather_test
        ports:
          - 25433:5432
        options: >-
          --health-cmd "pg_isready -U feather -d feather_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      FEATHER_TEST_DATABASE_URL: postgresql://feather:feather@127.0.0.1:25433/feather_test
      FEATHER_PERF_RESULTS: ${{ github.workspace }}/perf-results.jsonl
      FEATHER_PERF_MACHINE: github-ubuntu-latest
      FEATHER_PERF_CAPACITY: ${{ github.event_name != 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the product or the checks changed
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]             || ! git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- packages tests conftest.py pyproject.toml uv.lock .github/workflows/ci.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: steps.changes.outputs.run == 'true'
        run: uv sync --all-extras
      - if: steps.changes.outputs.run == 'true'
        name: Run the performance tests twice
        run: |
          for n in 1 2; do
            uv run pytest tests/perf tests/e2e/test_webhook_latency.py tests/e2e/test_webhook_to_http_latency.py -s || failed=1
          done
          exit ${failed:-0}
      - if: always() && steps.changes.outputs.run == 'true'
        name: Compare with the baseline
        run: uv run python tests/perf/compare.py perf-results.jsonl --summary "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: perf-results.jsonl
          if-no-files-found: ignore

  # Every commit of a contribution from a fork is signed off under the DCO (CONTRIBUTING.md, M3 plan 1 L2).
  dco:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Each commit has a Signed-off-by line
        run: |
          missing=0
          for sha in $(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git show -s --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $sha is not signed off: git rebase --signoff main"; missing=1
            fi
          done
          exit $missing

  # Security scans on every pull request (M3 plan 1 X1): Bandit over the product's code and pip-audit over the locked
  # dependencies. A finding of high severity fails the job; Trivy scans the images in the deploy job.
  security:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Bandit (SAST)
        run: uvx --from "bandit[toml]==1.8.6" bandit -c pyproject.toml -r packages -lll -q
      - name: pip-audit of uv.lock
        run: |
          uv export --frozen --all-extras --no-emit-workspace --no-hashes -o requirements-audit.txt
          uvx pip-audit==2.9.0 -r requirements-audit.txt --strict --progress-spinner off

  # The dashboard in Chromium: the operator journeys and axe's WCAG 2.1 AA checks, on the stack and the test Postgres.
  dashboard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: feather
          POSTGRES_PASSWORD: feather
          POSTGRES_DB: feather_test
        ports:
          - 25433:5432
        options: >-
          --health-cmd "pg_isready -U feather -d feather_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      FEATHER_TEST_DATABASE_URL: postgresql://feather:feather@127.0.0.1:25433/feather_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --all-extras
      # The runner image has Chromium's system libraries; apt's mirrors are sometimes out of the runner's reach.
      - run: uv run playwright install --with-deps chromium || uv run playwright install chromium
      - run: uv run pytest tests/dashboard -q

  # The images and the Compose stack: built for linux/amd64 and checked by tests/deploy, every night and on a pull
  # request that touches deploy/ or the packages the images hold. Images are built here, never pushed.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the images changed
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]             || ! git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- deploy packages templates examples uv.lock .dockerignore; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: steps.changes.outputs.run == 'true'
        run: uv sync --all-extras
      - if: steps.changes.outputs.run == 'true'
        run: uv run pytest tests/deploy -q
        env:
          FEATHER_COMPOSE_KEEP_IMAGES: "1"  # for Trivy, next
      # No known critical or high vulnerability in either image (NFR-10, M3 plan 1 X1).
      - if: steps.changes.outputs.run == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/feather-connect/feather-server:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - if: steps.changes.outputs.run == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/feather-connect/feather-worker:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-setup-trivy: true
