name: CI

on:
  pull_request:
  schedule:
    - cron: "17 2 * * *" # the nightly run of the engine conformance suite and the chaos and performance checks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest packages/feather-connect/tests packages/connectors packages/templates tests/demo tests/templates -m "not postgres"

  # The tests marked `postgres` need a server, which only Linux runners can host. This job runs every test
  # and holds the coverage gate.
  postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: feather
          POSTGRES_PASSWORD: feather
          POSTGRES_DB: feather_test
        ports:
          - 25433:5432
        options: >-
          --health-cmd "pg_isready -U feather -d feather_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      FEATHER_TEST_DATABASE_URL: postgresql://feather:feather@127.0.0.1:25433/feather_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --all-extras
      - run: uv run pytest packages/feather-connect/tests packages/feather-engine-dbos/tests packages/feather-server/tests packages/feather-cli/tests packages/connectors packages/templates tests/templates tests/e2e tests/dev --cov=feather_connect --cov=feather_engine_dbos --cov=feather_server --cov=feather_cli --cov-fail-under=85

  # The engine conformance suite starts real worker processes and takes minutes. It runs every night, and on a
  # pull request only when the change touches the engine.
  engine-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: feather
          POSTGRES_PASSWORD: feather
          POSTGRES_DB: feather_test
        ports:
          - 25433:5432
        options: >-
          --health-cmd "pg_isready -U feather -d feather_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      FEATHER_TEST_DATABASE_URL: postgresql://feather:feather@127.0.0.1:25433/feather_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the engine changed
        id: engine
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]             || ! git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- packages/feather-engine-dbos; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.engine.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: steps.engine.outputs.run == 'true'
        run: uv sync --all-extras
      - if: steps.engine.outputs.run == 'true'
        run: uv run pytest tests/engine_conformance

  # The chaos and performance checks kill real workers and servers and restart a database (a container of their own, on
  # 25434, with the Docker the runner has), and take minutes. They run every night, and on a pull request whenever the
  # change touches a package or a test, since crash safety and latency can break anywhere in the product's code.
  # The webhook latency, burst and schedule checks are named by file here: `tests/e2e` as a folder leaves them out.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: feather
          POSTGRES_PASSWORD: feather
          POSTGRES_DB: feather_test
        ports:
          - 25433:5432
        options: >-
          --health-cmd "pg_isready -U feather -d feather_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      FEATHER_TEST_DATABASE_URL: postgresql://feather:feather@127.0.0.1:25433/feather_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the product or the checks changed
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] \
            || ! git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- packages tests conftest.py pyproject.toml uv.lock .github/workflows/ci.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: steps.changes.outputs.run == 'true'
        run: uv sync --all-extras
      - if: steps.changes.outputs.run == 'true'
        run: uv run pytest tests/chaos tests/perf tests/hard_cases tests/e2e/test_webhook_latency.py tests/e2e/test_webhook_to_http_latency.py -s

  # The dashboard in Chromium: the operator journeys and axe's WCAG 2.1 AA checks, on the stack and the test Postgres.
  dashboard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04 # playwright's --with-deps can't reach apt's mirrors from the newer image
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: feather
          POSTGRES_PASSWORD: feather
          POSTGRES_DB: feather_test
        ports:
          - 25433:5432
        options: >-
          --health-cmd "pg_isready -U feather -d feather_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      FEATHER_TEST_DATABASE_URL: postgresql://feather:feather@127.0.0.1:25433/feather_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --all-extras
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/dashboard -q

  # The images and the Compose stack: built for linux/amd64 and checked by tests/deploy, every night and on a pull
  # request that touches deploy/ or the packages the images hold. Images are built here, never pushed.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the images changed
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]             || ! git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- deploy packages templates examples uv.lock .dockerignore; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: steps.changes.outputs.run == 'true'
        run: uv sync --all-extras
      - if: steps.changes.outputs.run == 'true'
        run: uv run pytest tests/deploy -q
