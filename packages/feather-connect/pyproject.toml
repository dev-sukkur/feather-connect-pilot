[project]
name = "feather-connect"
version = "0.1.0"
description = "SDK and runtime for Feather Connect, a code-first integration hub."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "cronsim",
    "cryptography>=44",  # AES-GCM for the sealed secrets of `${secret:db:…}`
    "httpx>=0.28.1",
    "jsonschema>=4",
    "packaging",
    "pyarrow",
    "pydantic>=2",
    "pyyaml",
    # Windows has no system time zone database, so zoneinfo needs this package there.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
postgres = [
    "alembic",
    "psycopg[binary,pool]",
]
# SQL transforms, reference lookups in SQL and derived datasets run on embedded DuckDB (M3.1 F1, F2).
sql = [
    "duckdb>=1.5",
]

# The connector registry finds connectors by these; each name is the connector's `spec.name`.
[project.entry-points."feather_connect.connectors"]
"memory.sink" = "feather_connect.connectors.memory:Sink"
"memory.source" = "feather_connect.connectors.memory:Source"
"simulation.sink" = "feather_connect.connectors.simulation:Sink"
"simulation.source" = "feather_connect.connectors.simulation:Source"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
