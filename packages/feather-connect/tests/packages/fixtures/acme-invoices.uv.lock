# A uv.lock for the sample package acme-invoices (dependencies = ["feather-connect"]), checked in so that the build
# test runs `uv export` from it with no network and no cache. The hashes are made up: nothing is downloaded.
version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "acme-invoices"
version = "1.0.0"
source = { virtual = "." }
dependencies = [
    { name = "feather-connect" },
]

[package.metadata]
requires-dist = [{ name = "feather-connect" }]

[[package]]
name = "feather-connect"
version = "0.1.0"
source = { registry = "https://pypi.org/simple" }
