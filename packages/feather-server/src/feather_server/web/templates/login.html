<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Feather Connect</title>
</head>
<body>
  <main>
    <h1>Sign in to Feather Connect</h1>
    {% if message %}<p role="alert">{{ message }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <p><label for="username">Username</label><br>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus></p>
      <p><label for="password">Password</label><br>
        <input id="password" name="password" type="password" autocomplete="current-password" required></p>
      <p><button type="submit">Sign in</button></p>
    </form>
  </main>
</body>
</html>
