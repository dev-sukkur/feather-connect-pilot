[project]
name = "feather-http"
version = "0.1.0"
description = "HTTP connectors for Feather Connect: a REST source and an outbound HTTP call sink."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "feather-connect",
    "httpx",
]

[project.entry-points."feather_connect.connectors"]
"graphql.mutation" = "feather_connect.connectors.graphql:Mutation"
"graphql.source" = "feather_connect.connectors.graphql:Source"
"http.call" = "feather_connect.connectors.http:Call"
"http.rest" = "feather_connect.connectors.http:Rest"
"http.webhook" = "feather_connect.connectors.http:Webhook"

[tool.uv.sources]
feather-connect = { workspace = true }

# The package adds modules to the namespace `feather_connect.connectors` and has no `__init__.py` there, nor in
# `feather_connect`, which belongs to the feather-connect distribution.
[tool.hatch.build.targets.wheel]
packages = ["src/feather_connect"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
