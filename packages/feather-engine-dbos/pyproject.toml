[project]
name = "feather-engine-dbos"
version = "0.1.0"
description = "DBOS Transact engine and worker runtime for Feather Connect."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "feather-connect[postgres]",
    "dbos==3.4.0",
]

[tool.uv.sources]
feather-connect = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
