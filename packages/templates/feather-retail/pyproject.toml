[project]
name = "feather-retail"
version = "0.1.0"
description = "Retail flow templates for Feather Connect, as library functions: Zakya invoices to an ERP."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "feather-connect",
    "feather-http",
]

[tool.uv.sources]
feather-connect = { workspace = true }
feather-http = { workspace = true }

# The package adds modules to the namespace `feather_connect.templates` and has no `__init__.py` there, nor in
# `feather_connect`, which belongs to the feather-connect distribution.
[tool.hatch.build.targets.wheel]
packages = ["src/feather_connect"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
