name: feather-spike

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: feather
      POSTGRES_PASSWORD: feather_spike   # throwaway, local-only container
      POSTGRES_DB: feather_spike
    ports:
      - "127.0.0.1:25432:5432"
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feather -d feather_spike"]
      interval: 2s
      timeout: 2s
      retries: 30
