# The Zakya demo: invoices from a Zakya-like API go to an ERP, one POST each, every minute.
# Both ends are small simulators in sims/; env/dev.yaml points the connections at them.
# `feather validate --project examples/zakya-demo` checks it.
name: zakya-demo
modules: [flows.invoices]
settings: {timezone: UTC}
budgets:
  zoho-api: {limits: ["90/minute", "1400/day"]}
connections:
  zakya:
    connector: http.rest
    budget: zoho-api
    auth_scheme: oauth2_refresh_token
    token_prefix: Zoho-oauthtoken
    params: {organization_id: "60001"}
  erp:
    connector: http.call
    auth_scheme: bearer
