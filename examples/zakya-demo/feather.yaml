# The Zakya demo: invoices from a Zakya-like API go to an ERP, one PUT each, every minute, and with Zakya's credit
# notes (goods returned) to Postgres staging. From staging to SAP through CPI (fc.on_ready, at most every 5 minutes):
# B2B invoices and credit notes one document each, held over 500,000 for an approver (flows/chain.py); B2C sales and
# returns summed per day and material (flows/b2c.py). Materials are found by EAN in SAP's material master.
# Both ends are small simulators in sims/; env/dev.yaml points the connections at them.
# `feather validate --project examples/zakya-demo` checks it.
name: zakya-demo
modules: [flows.invoices, flows.chain, flows.b2c]
settings: {timezone: UTC}
# The budget is the organisation's: every tenant, flow and connection that names the account shares its windows.
budgets:
  zoho-api: {limits: ["90/minute", "1400/day"], account: "zakya:60001"}
connections:
  zakya:
    connector: zakya
    budget: zoho-api
    domain: in
    organization_id: "60001"
  erp:
    connector: http.call
    auth_scheme: bearer
  # The chain (flows/chain.py): the staging table in the Postgres of `feather dev`, and SAP through CPI.
  staging: {connector: postgres.table, schema: zakya_demo}
  staging_read: {connector: postgres.query, schema: zakya_demo}
  sap: {connector: sap_cpi.post, csrf: true}
  sap_master: {connector: sap_cpi.source}
# `feather dev` starts these first, in this directory, and stops them with the rest.
dev:
  processes:
    - {name: zakya-sim, command: [python, sims/zakya.py, --port, "29100", --state, .data/zakya.json], port: 29100}
    - {name: erp-sim, command: [python, sims/receiver.py, --port, "29101", --db, .data/receiver.sqlite], port: 29101}
    - {name: sap-sim, command: [python, sims/sap.py, --port, "29102", --db, .data/sap.sqlite], port: 29102}
    - {name: staging, command: [python, sims/staging.py]}
