# The simulators on this machine. The credentials are obviously fake files in secrets/, read against the
# project directory.
# The simulator makes about 8 calls a minute, which would spend Zoho's 1400 a day in three hours: a dev day gets more.
budgets:
  zoho-api: {limits: ["90/minute", "20000/day"], account: "zakya:60001"}
connections:
  zakya:
    base_url: http://127.0.0.1:29100
    accounts_url: http://127.0.0.1:29100
    retry_attempts: 4
    auth:
      client_id: ${secret:file:secrets/zakya-client-id.txt}
      client_secret: ${secret:file:secrets/zakya-client-secret.txt}
      refresh_token: ${secret:file:secrets/zakya-refresh-token.txt}
  erp:
    base_url: http://127.0.0.1:29101
    retry_attempts: 4
    auth:
      token: ${secret:file:secrets/erp-token.txt}
  staging:
    auth: {dsn: "${secret:env:FEATHER_DATABASE_URL}"}
  staging_read:
    auth: {dsn: "${secret:env:FEATHER_DATABASE_URL}"}
  sap:
    base_url: http://127.0.0.1:29102
    token_url: http://127.0.0.1:29102/oauth/token
    retry_attempts: 4
    auth:
      client_id: ${secret:file:secrets/cpi-client-id.txt}
      client_secret: ${secret:file:secrets/cpi-client-secret.txt}
