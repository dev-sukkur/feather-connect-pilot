# The simulators on this machine. The credentials are obviously fake files in secrets/, read against the
# project directory.
connections:
  zakya:
    base_url: http://127.0.0.1:29100
    token_url: http://127.0.0.1:29100/oauth/v2/token
    retry_attempts: 4
    auth:
      client_id: ${secret:file:secrets/zakya-client-id.txt}
      client_secret: ${secret:file:secrets/zakya-client-secret.txt}
      refresh_token: ${secret:file:secrets/zakya-refresh-token.txt}
  erp:
    base_url: http://127.0.0.1:29101
    retry_attempts: 4
    auth:
      token: ${secret:file:secrets/erp-token.txt}
