# The shop's categories, copied from its Postgres to a MotherDuck bronze table by their change stamp.
name: db-to-warehouse
modules: [flows.categories]
settings: {timezone: UTC}
connections:
  app_db:
    connector: postgres.query
    schema: public
    auth: {dsn: "${secret:env:APP_DB_DSN}"}
  warehouse:
    connector: duckdb.table
    database: md:bronze
    auth: {token: "${secret:env:MOTHERDUCK_TOKEN}"}
